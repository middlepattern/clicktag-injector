<script>
    // --- EXACT START AND END CODES ---
    const START_CODE = `<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<meta charset="UTF-8">
<head>
	<meta name="ad.size" content="width=300,height=600">
		<script type="text/javascript">
			var clickTag = "https://research.ucalgary.ca/energy";
		<\/script>
	<style>
		body{
			background-color:#000000;
			margin: 0px;
			height: 100%;
			overflow: hidden;
		}
		#lottie{
			background-color:#000000;
			width:100%;
			height:100%;
			display:block;
			overflow: hidden;
			transform: translate3d(0,0,0);
			text-align: center;
			opacity: 1;
		}

	</style>
</head>
<body>
		<a href="javascript:void(window.open(clickTag))">
`;

    // Breaking up the closing script tag so the browser doesn't panic
    const END_CODE = '\n</sc' + 'ript>\n\t</a>\n</body>\n</html>';

    // 1. PREVENT NATIVE BROWSER FILE OPENING
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        window.addEventListener(eventName, function(e) {
            e.preventDefault();
            e.stopPropagation();
        }, false);
    });

    const dropZone = document.getElementById('drop-zone');
    const statusText = document.getElementById('status');
    const urlInput = document.getElementById('urlInput');

    dropZone.addEventListener('dragover', () => {
        dropZone.classList.add('hover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('hover');
    });

    // Handle multiple file drops
    dropZone.addEventListener('drop', async (e) => {
        dropZone.classList.remove('hover');
        
        // Grab all files dropped, filter only for .zip
        const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.zip'));
        
        if (files.length > 0) {
            statusText.innerText = `Processing ${files.length} file(s)...`;
            statusText.style.color = "#007bff";
            
            // Process each zip sequentially
            for (let i = 0; i < files.length; i++) {
                statusText.innerText = `Processing file ${i + 1} of ${files.length}...`;
                await processZip(files[i]);
            }
            
            statusText.innerText = `Done! Downloaded ${files.length} file(s).`;
            statusText.style.color = "green";
        } else {
            statusText.innerText = "Error: Please drop at least one .zip file.";
            statusText.style.color = "red";
        }
    });

    async function processZip(file) {
        const targetUrl = urlInput.value.trim();

        try {
            const zip = await JSZip.loadAsync(file);
            const newZip = new JSZip();
            const files = Object.keys(zip.files);
            
            for (const relativePath of files) {
                const zipEntry = zip.files[relativePath];
                
                if (zipEntry.dir || relativePath.includes('__MACOSX') || relativePath.endsWith('.DS_Store')) {
                    continue; 
                }
                
                let newPath = relativePath;
                if (relativePath.includes('/demo/') || relativePath.startsWith('demo/')) {
                    newPath = relativePath.replace('/demo/', '/').replace(/^demo\//, '');
                }
                
                if (relativePath.endsWith('data.html')) {
                    newPath = newPath.replace('data.html', 'index.html');
                    
                    let final_width = "300", final_height = "600";
                    const pathParts = relativePath.split('/');
                    const demoIdx = pathParts.indexOf('demo');
                    
                    if (demoIdx > 0) {
                        const dimFolder = pathParts[demoIdx - 1]; 
                        if (dimFolder.includes('x')) {
                            [final_width, final_height] = dimFolder.split('x');
                        }
                    }

                    let textmani = await zipEntry.async("string");
                    let start_idx = textmani.indexOf('<!-- build:scripto -->');
                    if (start_idx === -1) start_idx = textmani.indexOf('<script>');
                    let end_idx = textmani.lastIndexOf('</sc' + 'ript>');

                    if (start_idx !== -1 && end_idx !== -1) {
                        let payload = textmani.substring(start_idx, end_idx);
                        
                        let temp_size = `content="width=${final_width},height=${final_height}">`;
                        let customStart = START_CODE.replace('content="width=300,height=600">', temp_size);
                        customStart = customStart.replace("https://research.ucalgary.ca/energy", targetUrl);
                        
                        let finalHtml = customStart + payload + END_CODE;
                        newZip.file(newPath, finalHtml);
                    } else {
                        newZip.file(newPath, textmani);
                    }
                } else {
                    let fileContent = await zipEntry.async("arraybuffer");
                    newZip.file(newPath, fileContent);
                }
            }

            const content = await newZip.generateAsync({type:"blob"});
            // Trigger the download with the exact original file name
            saveAs(content, file.name);

        } catch (err) {
            console.error(`Error processing ${file.name}:`, err);
        }
    }
</script>
